<div class="auth-field">
  <label for="{{ field.id_for_label }}" class="auth-label">
    {{ field.label }}{% if field.field.required %}<span class="text-red-600" aria-hidden="true"> *</span>{% endif %}
  </label>

  {{ field }}

  {% if field.help_text %}
    <p class="auth-help-text">{{ field.help_text }}</p>
  {% endif %}

  {% for error in field.errors %}
    <p class="auth-field-error" role="alert">{{ error }}</p>
  {% endfor %}
</div>
