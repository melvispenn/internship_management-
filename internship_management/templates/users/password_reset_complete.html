{% extends "users/auth_base.html" %}
{% block title %}Password updated · InPACE{% endblock title %}
{% block content %}
  <section class="rounded-2xl border border-[#E2E8F0] bg-white p-6 text-center shadow-[0_12px_40px_rgba(5,33,82,0.08)] sm:p-8">
    <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-full bg-[#F0FDF4] text-[#16993C]" aria-hidden="true">✓</div>
    <h1 class="text-3xl font-bold tracking-tight text-[#052152]">Password updated</h1>
    <p class="mt-3 text-sm leading-6 text-[#64748B]">Your password has been changed successfully. You can now sign in.</p>
    <a href="{% url 'users:login' %}" class="mt-7 inline-block rounded-xl bg-[#0371DA] px-5 py-3 text-sm font-bold text-white hover:bg-[#0352B4]">Sign in</a>
  </section>
{% endblock content %}
