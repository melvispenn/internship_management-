{% extends "users/auth_base.html" %}
{% block title %}Check your email · InPACE{% endblock title %}
{% block content %}
  <section class="rounded-2xl border border-[#E2E8F0] bg-white p-6 text-center shadow-[0_12px_40px_rgba(5,33,82,0.08)] sm:p-8">
    <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-full bg-[#F0FDF4] text-[#16993C]" aria-hidden="true">✓</div>
    <h1 class="text-3xl font-bold tracking-tight text-[#052152]">Check your email</h1>
    <p class="mt-3 text-sm leading-6 text-[#64748B]">If an account exists for that email, we’ve sent instructions to reset your password.</p>
    <a href="{% url 'users:login' %}" class="mt-7 inline-block font-bold text-[#0352B4] hover:text-[#0371DA]">Back to sign in</a>
  </section>
{% endblock content %}
