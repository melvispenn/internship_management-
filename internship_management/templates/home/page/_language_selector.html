{% load i18n %}
<details class="relative {% if mobile %}w-full{% endif %}">
  <summary class="flex min-h-10 min-w-[84px] {% if mobile %}w-full{% endif %} cursor-pointer list-none items-center justify-between gap-2 rounded-xl border border-inpace-blue-100 bg-white px-3 py-2 text-sm font-semibold text-inpace-navy-900 transition hover:border-inpace-blue-400 hover:bg-inpace-blue-100 focus-visible:ring-inpace-bright-blue">
    <span>{% translate "English" %}</span>
    <svg aria-hidden="true" class="h-4 w-4 text-inpace-blue" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.51a.75.75 0 0 1-1.08 0l-4.25-4.51a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" /></svg>
  </summary>
  <div class="absolute right-0 top-12 z-50 min-w-36 rounded-xl border border-slate-200 bg-white p-2 shadow-lg {% if mobile %}left-0 right-auto top-11 w-full{% endif %}">
    {% get_available_languages as available_languages %}
    {% for language_code, language_name in available_languages %}
      <form method="post" action="{% url 'set_language' %}">
        {% csrf_token %}
        <input type="hidden" name="language" value="{{ language_code }}" />
        <input type="hidden" name="next" value="{{ request.get_full_path }}" />
        <button type="submit" class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-inpace-navy hover:bg-slate-100 focus-visible:ring-inpace-bright-blue">
          {% if language_code == 'en-us' %}{% translate "English" %}{% else %}{% translate "Français" %}{% endif %}
        </button>
      </form>
    {% endfor %}
  </div>
</details>
