{% load i18n %}
<details class="relative"><summary class="btn-secondary cursor-pointer list-none">{% translate "English" %}</summary><div class="absolute right-0 top-12 z-50 min-w-36 rounded-xl border border-slate-200 bg-white p-2 shadow-lg">{% get_available_languages as available_languages %}{% for language_code, language_name in available_languages %}<form method="post" action="{% url 'set_language' %}">{% csrf_token %}<input type="hidden" name="language" value="{{ language_code }}" /><input type="hidden" name="next" value="{{ request.get_full_path }}" /><button type="submit" class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-inpace-navy hover:bg-slate-100">{% if language_code == 'en-us' %}{% translate "English" %}{% else %}{% translate "Français" %}{% endif %}</button></form>{% endfor %}</div></details>
